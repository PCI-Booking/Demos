<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PCI Booking - Automated Test Suite</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; }

  .app-container { display: grid; grid-template-columns: 350px 1fr 400px; height: 100vh; }

  /* Left Panel - Test Cases */
  .test-panel { background: #16213e; border-right: 1px solid #0f3460; overflow-y: auto; }
  .panel-header { background: #0f3460; padding: 16px; border-bottom: 3px solid #fdb913; position: sticky; top: 0; z-index: 10; }
  .panel-header h2 { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .panel-header h2::before { content: ''; width: 8px; height: 8px; background: #fdb913; border-radius: 50%; }

  .test-category { border-bottom: 1px solid #0f3460; }
  .category-header { padding: 12px 16px; background: #1a1a2e; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 600; text-transform: uppercase; color: #fdb913; }
  .category-header:hover { background: #0f3460; }
  .category-content { display: none; }
  .category-content.expanded { display: block; }

  .test-item { padding: 12px 16px; border-bottom: 1px solid #0f3460; cursor: pointer; transition: all 0.2s; }
  .test-item:hover { background: #0f3460; }
  .test-item.selected { background: #0f3460; border-left: 3px solid #fdb913; }
  .test-item.passed { border-left: 3px solid #4caf50; }
  .test-item.failed { border-left: 3px solid #f44336; }
  .test-item.running { border-left: 3px solid #fdb913; animation: pulse 1s infinite; }
  .test-name { font-size: 13px; font-weight: 500; margin-bottom: 4px; }
  .test-desc { font-size: 11px; color: #888; }
  .test-status { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 10px; }
  .status-badge { padding: 2px 8px; border-radius: 10px; font-weight: 600; }
  .status-badge.pending { background: #333; color: #888; }
  .status-badge.running { background: #fdb913; color: #333; }
  .status-badge.passed { background: #4caf50; color: white; }
  .status-badge.failed { background: #f44336; color: white; }

  @keyframes pulse { 0%,100%{ opacity:1; } 50%{ opacity:0.6; } }

  /* Center Panel - Test Execution */
  .execution-panel { background: #1a1a2e; display: flex; flex-direction: column; }
  .execution-header { background: #0f3460; padding: 16px 20px; border-bottom: 3px solid #fdb913; display: flex; justify-content: space-between; align-items: center; }
  .execution-title { font-size: 16px; font-weight: 600; }
  .execution-controls { display: flex; gap: 10px; }

  .btn { padding: 8px 16px; border: none; border-radius: 4px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 6px; }
  .btn-primary { background: #fdb913; color: #333; }
  .btn-primary:hover { background: #e5a811; }
  .btn-primary:disabled { background: #666; color: #999; cursor: not-allowed; }
  .btn-secondary { background: #333; color: white; border: 1px solid #555; }
  .btn-secondary:hover { background: #444; }
  .btn-danger { background: #f44336; color: white; }
  .btn-danger:hover { background: #d32f2f; }
  .btn-success { background: #4caf50; color: white; }
  .btn-success:hover { background: #43a047; }

  .test-instructions { background: #16213e; padding: 16px 20px; border-bottom: 1px solid #0f3460; }
  .instruction-card { background: #0f3460; border-radius: 8px; padding: 16px; }
  .instruction-title { font-size: 14px; font-weight: 600; color: #fdb913; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .card-details { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 12px; }
  .card-field { background: #1a1a2e; padding: 10px; border-radius: 4px; }
  .card-field-label { font-size: 10px; color: #888; text-transform: uppercase; margin-bottom: 4px; }
  .card-field-value { font-size: 14px; font-family: monospace; color: #4fc3f7; user-select: all; }
  .card-field-value.highlight { color: #fdb913; font-weight: bold; }
  .instruction-steps { font-size: 12px; color: #aaa; }
  .instruction-steps ol { margin-left: 20px; }
  .instruction-steps li { margin-bottom: 6px; }
  .otp-info { background: #1a1a2e; padding: 10px; border-radius: 4px; margin-top: 10px; border-left: 3px solid #fdb913; }
  .otp-info strong { color: #fdb913; }

  .iframe-container { flex: 1; padding: 20px; overflow: auto; display: flex; flex-direction: column; }
  .iframe-wrapper { background: white; border-radius: 8px; overflow: hidden; flex: 1; min-height: 400px; position: relative; }
  .iframe-wrapper.recording { box-shadow: 0 0 0 3px #f44336; }
  .iframe-wrapper.recording::after { content: 'REC'; position: absolute; top: 10px; right: 10px; background: #f44336; color: white; padding: 4px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; animation: pulse 1s infinite; }
  #testIframe { width: 100%; height: 100%; border: none; }

  /* Right Panel - Results */
  .results-panel { background: #16213e; border-left: 1px solid #0f3460; display: flex; flex-direction: column; }
  .results-tabs { display: flex; background: #0f3460; }
  .results-tab { flex: 1; padding: 12px; text-align: center; font-size: 12px; font-weight: 600; cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.2s; }
  .results-tab:hover { background: #1a1a2e; }
  .results-tab.active { border-bottom-color: #fdb913; background: #1a1a2e; }

  .results-content { flex: 1; overflow-y: auto; }
  .tab-content { display: none; padding: 16px; }
  .tab-content.active { display: block; }

  /* Event Log */
  .event-log { font-family: 'Monaco', 'Menlo', monospace; font-size: 11px; }
  .event-entry { padding: 8px 10px; margin-bottom: 6px; border-radius: 4px; background: #0f3460; border-left: 3px solid #555; }
  .event-entry.expected { border-color: #4caf50; }
  .event-entry.unexpected { border-color: #ff9800; }
  .event-entry.error { border-color: #f44336; }
  .event-entry.info { border-color: #2196f3; }
  .event-time { color: #666; font-size: 10px; }
  .event-type { color: #fdb913; font-weight: bold; }
  .event-data { color: #aaa; margin-top: 4px; word-break: break-all; }
  .event-validation { margin-top: 4px; font-size: 10px; padding: 4px 8px; border-radius: 4px; display: inline-block; }
  .event-validation.pass { background: #4caf50; color: white; }
  .event-validation.fail { background: #f44336; color: white; }

  /* Test Report */
  .report-summary { background: #0f3460; padding: 16px; border-radius: 8px; margin-bottom: 16px; }
  .report-title { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: #fdb913; }
  .report-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .report-stat { text-align: center; padding: 12px; background: #1a1a2e; border-radius: 4px; }
  .report-stat-value { font-size: 24px; font-weight: bold; }
  .report-stat-value.passed { color: #4caf50; }
  .report-stat-value.failed { color: #f44336; }
  .report-stat-value.total { color: #fdb913; }
  .report-stat-label { font-size: 10px; color: #888; margin-top: 4px; }

  .report-detail { background: #0f3460; padding: 16px; border-radius: 8px; margin-bottom: 12px; }
  .report-detail-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .report-detail-title { font-size: 13px; font-weight: 600; }
  .report-detail-status { font-size: 11px; padding: 4px 10px; border-radius: 10px; }
  .report-detail-status.passed { background: #4caf50; }
  .report-detail-status.failed { background: #f44336; }
  .report-assertions { font-size: 11px; }
  .assertion-item { padding: 6px 0; border-bottom: 1px solid #1a1a2e; display: flex; align-items: center; gap: 8px; }
  .assertion-item:last-child { border-bottom: none; }
  .assertion-icon { width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; }
  .assertion-icon.pass { background: #4caf50; }
  .assertion-icon.fail { background: #f44336; }

  /* Video/Screenshot */
  .media-container { padding: 16px; }
  .media-item { background: #0f3460; border-radius: 8px; margin-bottom: 12px; overflow: hidden; }
  .media-header { padding: 10px 12px; background: #1a1a2e; font-size: 12px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
  .media-content { padding: 12px; }
  .media-content video, .media-content img { width: 100%; border-radius: 4px; }
  .no-media { text-align: center; padding: 40px; color: #666; }

  /* Custom Test Builder */
  .builder-form { padding: 16px; }
  .form-group { margin-bottom: 16px; }
  .form-label { font-size: 11px; font-weight: 600; color: #888; text-transform: uppercase; margin-bottom: 6px; display: block; }
  .form-input, .form-select, .form-textarea { width: 100%; padding: 10px; background: #0f3460; border: 1px solid #333; border-radius: 4px; color: white; font-size: 12px; }
  .form-input:focus, .form-select:focus, .form-textarea:focus { outline: none; border-color: #fdb913; }
  .form-textarea { min-height: 80px; resize: vertical; font-family: monospace; }

  /* Toast notifications */
  .toast { position: fixed; bottom: 20px; right: 20px; background: #333; color: white; padding: 12px 20px; border-radius: 8px; font-size: 13px; z-index: 1000; animation: slideIn 0.3s ease; }
  .toast.success { background: #4caf50; }
  .toast.error { background: #f44336; }
  @keyframes slideIn { from { transform: translateY(100px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  /* Run All Progress */
  .run-all-progress { background: #0f3460; padding: 12px 16px; border-bottom: 1px solid #333; display: none; }
  .run-all-progress.active { display: block; }
  .progress-bar { height: 4px; background: #333; border-radius: 2px; overflow: hidden; margin-top: 8px; }
  .progress-fill { height: 100%; background: #fdb913; transition: width 0.3s; }
  .progress-text { font-size: 11px; color: #888; }
</style>
</head>
<body>
<div class="app-container">
  <!-- Left Panel - Test Cases -->
  <div class="test-panel">
    <div class="panel-header">
      <h2>Test Suite</h2>
    </div>

    <div class="run-all-progress" id="runAllProgress">
      <div class="progress-text" id="progressText">Running tests: 0/0</div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width: 0%"></div></div>
    </div>

    <div id="testCategories"></div>

    <div style="padding: 16px; border-top: 1px solid #0f3460;">
      <button class="btn btn-primary" style="width: 100%; margin-bottom: 8px;" onclick="runAllTests()">Run All Tests</button>
      <button class="btn btn-secondary" style="width: 100%; margin-bottom: 8px;" onclick="showCustomBuilder()">+ Create Custom Test</button>
      <div style="display: flex; gap: 8px;">
        <button class="btn btn-secondary" style="flex: 1;" onclick="exportTests()">Export</button>
        <button class="btn btn-secondary" style="flex: 1;" onclick="importTests()">Import</button>
      </div>
    </div>
  </div>

  <!-- Center Panel - Test Execution -->
  <div class="execution-panel">
    <div class="execution-header">
      <div class="execution-title" id="currentTestTitle">Select a test to begin</div>
      <div class="execution-controls">
        <button class="btn btn-secondary" id="btnStartRecording" onclick="toggleRecording()">Start Recording</button>
        <button class="btn btn-primary" id="btnRunTest" onclick="runCurrentTest()" disabled>Run Test</button>
        <button class="btn btn-danger" id="btnStopTest" onclick="stopCurrentTest()" style="display: none;">Stop</button>
      </div>
    </div>

    <div class="test-instructions" id="testInstructions" style="display: none;">
      <div class="instruction-card">
        <div class="instruction-title" id="instructionTitle">Test Instructions</div>
        <div class="card-details" id="cardDetails"></div>
        <div class="otp-info" id="otpInfo" style="display: none;"></div>
        <div class="instruction-steps" id="instructionSteps"></div>
      </div>
    </div>

    <div class="iframe-container">
      <div class="iframe-wrapper" id="iframeWrapper">
        <iframe id="testIframe" src="about:blank"></iframe>
      </div>
    </div>
  </div>

  <!-- Right Panel - Results -->
  <div class="results-panel">
    <div class="results-tabs">
      <div class="results-tab active" onclick="switchTab('events')">Events</div>
      <div class="results-tab" onclick="switchTab('report')">Report</div>
      <div class="results-tab" onclick="switchTab('media')">Media</div>
      <div class="results-tab" onclick="switchTab('builder')">Builder</div>
    </div>

    <div class="results-content">
      <!-- Events Tab -->
      <div class="tab-content active" id="tab-events">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
          <span style="font-size: 12px; color: #888;">PostMessage Events</span>
          <button class="btn btn-secondary" style="padding: 4px 10px; font-size: 10px;" onclick="clearEvents()">Clear</button>
        </div>
        <div class="event-log" id="eventLog">
          <div style="text-align: center; color: #666; padding: 40px;">No events captured yet</div>
        </div>
      </div>

      <!-- Report Tab -->
      <div class="tab-content" id="tab-report">
        <div class="report-summary">
          <div class="report-title">Test Results Summary</div>
          <div class="report-stats">
            <div class="report-stat">
              <div class="report-stat-value passed" id="passedCount">0</div>
              <div class="report-stat-label">Passed</div>
            </div>
            <div class="report-stat">
              <div class="report-stat-value failed" id="failedCount">0</div>
              <div class="report-stat-label">Failed</div>
            </div>
            <div class="report-stat">
              <div class="report-stat-value total" id="totalCount">0</div>
              <div class="report-stat-label">Total</div>
            </div>
          </div>
        </div>
        <div id="reportDetails"></div>
        <button class="btn btn-secondary" style="width: 100%; margin-top: 12px;" onclick="downloadReport()">Download Report</button>
      </div>

      <!-- Media Tab -->
      <div class="tab-content" id="tab-media">
        <div class="media-container" id="mediaContainer">
          <div class="no-media">No recordings or screenshots yet.<br>Start recording before running a test.</div>
        </div>
      </div>

      <!-- Builder Tab -->
      <div class="tab-content" id="tab-builder">
        <div class="builder-form">
          <div class="form-group">
            <label class="form-label">Test Name</label>
            <input type="text" class="form-input" id="builderName" placeholder="My Custom Test">
          </div>
          <div class="form-group">
            <label class="form-label">Description</label>
            <input type="text" class="form-input" id="builderDesc" placeholder="Test description">
          </div>
          <div class="form-group">
            <label class="form-label">Card Number</label>
            <input type="text" class="form-input" id="builderCard" placeholder="4111111111111111">
          </div>
          <div class="form-group">
            <label class="form-label">Expiry (MM/YY)</label>
            <input type="text" class="form-input" id="builderExpiry" placeholder="12/28">
          </div>
          <div class="form-group">
            <label class="form-label">CVV</label>
            <input type="text" class="form-input" id="builderCvv" placeholder="123">
          </div>
          <div class="form-group">
            <label class="form-label">Name on Card</label>
            <input type="text" class="form-input" id="builderName2" placeholder="Test User">
          </div>
          <div class="form-group">
            <label class="form-label">3DS Enabled</label>
            <select class="form-select" id="builder3ds">
              <option value="false">No</option>
              <option value="true">Yes</option>
            </select>
          </div>
          <div class="form-group" id="builderOtpGroup" style="display: none;">
            <label class="form-label">OTP (if challenge)</label>
            <input type="text" class="form-input" id="builderOtp" placeholder="0101">
          </div>
          <div class="form-group">
            <label class="form-label">Custom Validation</label>
            <select class="form-select" id="builderValidation">
              <option value="accept">Accept</option>
              <option value="reject">Reject</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Expected Outcome</label>
            <select class="form-select" id="builderOutcome">
              <option value="success">Success (CardSubmitSuccess)</option>
              <option value="failure">Failure (CardSubmitFailure)</option>
              <option value="validation-reject">Custom Validation Reject</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Expected Events (JSON array)</label>
            <textarea class="form-textarea" id="builderEvents" placeholder='["ready", "CustomValidation", "CardSubmitSuccess"]'></textarea>
          </div>
          <button class="btn btn-primary" style="width: 100%;" onclick="saveCustomTest()">Save Custom Test</button>
        </div>
      </div>
    </div>
  </div>
</div>

<input type="file" id="importFile" style="display: none;" accept=".json" onchange="handleImport(event)">

<script>
// ==================== TEST CARDS DATA ====================
const TEST_CARDS = {
  // Frictionless 3DS
  visa_frictionless: { number: '4761739000060016', expiry: '12/28', cvv: '123', name: 'Three DS test', type: 'visa', flow: 'frictionless' },
  mc_frictionless: { number: '5455330200000016', expiry: '12/28', cvv: '123', name: 'Three DS test', type: 'mastercard', flow: 'frictionless' },

  // Device Fingerprint (DFP)
  visa_dfp: { number: '4761739001010010', expiry: '12/28', cvv: '123', name: 'Three DS test', type: 'visa', flow: 'dfp' },
  mc_dfp: { number: '5185520050000010', expiry: '12/28', cvv: '123', name: 'Three DS test', type: 'mastercard', flow: 'dfp' },

  // Challenge
  visa_challenge: { number: '4018810000150015', expiry: '12/28', cvv: '123', name: 'Three DS test', type: 'visa', flow: 'challenge', successOtp: '0101', failOtp: '3333' },
  mc_challenge: { number: '5299910010000015', expiry: '12/28', cvv: '123', name: 'Three DS test', type: 'mastercard', flow: 'challenge', successOtp: '4445', failOtp: '9999' },

  // DFP + Challenge
  visa_dfp_challenge: { number: '4018810000190011', expiry: '12/28', cvv: '123', name: 'Three DS test', type: 'visa', flow: 'dfp_challenge', successOtp: '0101', failOtp: '3333' },
  mc_dfp_challenge: { number: '5420711000401011', expiry: '12/28', cvv: '123', name: 'Three DS test', type: 'mastercard', flow: 'dfp_challenge', successOtp: '4445', failOtp: '9999' },

  // Invalid cards for failure tests
  invalid_luhn: { number: '4111111111111112', expiry: '12/28', cvv: '123', name: 'Test User', type: 'unknown', flow: 'none' },
  invalid_bin: { number: '0000000000000000', expiry: '12/28', cvv: '123', name: 'Test User', type: 'unknown', flow: 'none' }
};

// ==================== PREDEFINED TEST SCENARIOS ====================
const PREDEFINED_TESTS = {
  'non-3ds': [
    {
      id: 'non3ds-visa-success',
      name: 'Visa - Successful Tokenization',
      description: 'Valid Visa card without 3DS, custom validation accepts',
      card: TEST_CARDS.visa_frictionless,
      config: { ThreeDS: 'false', useCustomValidation: 'true', customValidationAction: 'accept' },
      expectedEvents: ['ready', 'CustomValidation', 'CardSubmitSuccess'],
      expectedOutcome: 'success',
      assertions: [
        { type: 'event', event: 'ready', description: 'Iframe loads successfully' },
        { type: 'event', event: 'CustomValidation', description: 'Custom validation triggered' },
        { type: 'event', event: 'CardSubmitSuccess', description: 'Card tokenized successfully' },
        { type: 'response', field: 'cardToken', check: 'exists', description: 'Card token received' }
      ]
    },
    {
      id: 'non3ds-mc-success',
      name: 'Mastercard - Successful Tokenization',
      description: 'Valid Mastercard without 3DS, custom validation accepts',
      card: TEST_CARDS.mc_frictionless,
      config: { ThreeDS: 'false', useCustomValidation: 'true', customValidationAction: 'accept' },
      expectedEvents: ['ready', 'CustomValidation', 'CardSubmitSuccess'],
      expectedOutcome: 'success',
      assertions: [
        { type: 'event', event: 'ready', description: 'Iframe loads successfully' },
        { type: 'event', event: 'CustomValidation', description: 'Custom validation triggered' },
        { type: 'event', event: 'CardSubmitSuccess', description: 'Card tokenized successfully' }
      ]
    },
    {
      id: 'non3ds-custom-reject',
      name: 'Custom Validation - Reject Card',
      description: 'Valid card rejected by custom validation',
      card: TEST_CARDS.visa_frictionless,
      config: { ThreeDS: 'false', useCustomValidation: 'true', customValidationAction: 'reject' },
      expectedEvents: ['ready', 'CustomValidation'],
      expectedOutcome: 'validation-reject',
      assertions: [
        { type: 'event', event: 'ready', description: 'Iframe loads successfully' },
        { type: 'event', event: 'CustomValidation', description: 'Custom validation triggered' },
        { type: 'no-event', event: 'CardSubmitSuccess', description: 'Card NOT tokenized (rejected)' }
      ]
    },
    {
      id: 'non3ds-invalid-luhn',
      name: 'Invalid Card - Luhn Check Failure',
      description: 'Card number fails Luhn algorithm validation',
      card: TEST_CARDS.invalid_luhn,
      config: { ThreeDS: 'false', useCustomValidation: 'false' },
      expectedEvents: ['ready'],
      expectedOutcome: 'failure',
      assertions: [
        { type: 'event', event: 'ready', description: 'Iframe loads successfully' },
        { type: 'validation-fail', description: 'Card number validation fails' }
      ]
    }
  ],
  '3ds-frictionless': [
    {
      id: '3ds-visa-frictionless',
      name: 'Visa - 3DS Frictionless Success',
      description: '3DS frictionless flow - no user challenge required',
      card: TEST_CARDS.visa_frictionless,
      config: { ThreeDS: 'true', useCustomValidation: 'true', customValidationAction: 'accept', email: 'test@test.com', amount: '1000' },
      expectedEvents: ['ready', 'CustomValidation', 'CardSubmitSuccess'],
      expectedOutcome: 'success',
      assertions: [
        { type: 'event', event: 'ready', description: 'Iframe loads successfully' },
        { type: 'event', event: 'CustomValidation', description: 'Custom validation triggered' },
        { type: 'event', event: 'CardSubmitSuccess', description: 'Card tokenized with 3DS' },
        { type: 'response', field: 'threeDSecIndication', check: 'exists', description: '3DS indication received' }
      ]
    },
    {
      id: '3ds-mc-frictionless',
      name: 'Mastercard - 3DS Frictionless Success',
      description: '3DS frictionless flow with Mastercard',
      card: TEST_CARDS.mc_frictionless,
      config: { ThreeDS: 'true', useCustomValidation: 'true', customValidationAction: 'accept', email: 'test@test.com', amount: '1000' },
      expectedEvents: ['ready', 'CustomValidation', 'CardSubmitSuccess'],
      expectedOutcome: 'success',
      assertions: [
        { type: 'event', event: 'ready', description: 'Iframe loads successfully' },
        { type: 'event', event: 'CardSubmitSuccess', description: 'Card tokenized with 3DS' }
      ]
    }
  ],
  '3ds-challenge': [
    {
      id: '3ds-visa-challenge-success',
      name: 'Visa - 3DS Challenge Success',

// ==================== STATE ====================
let currentTest = null;
let testResults = {};
let capturedEvents = [];
let isRunning = false;
let isRecording = false;
let mediaRecorder = null;
let recordedChunks = [];
let mediaItems = [];
let customTests = [];
let iframeReady = false;
let lastValidationData = null;

const iframe = document.getElementById('testIframe');
const iframeWrapper = document.getElementById('iframeWrapper');

// ==================== INITIALIZATION ====================
function init() {
  loadCustomTests();
  renderTestCategories();
  setupPostMessageListener();

  // Builder 3DS toggle
  document.getElementById('builder3ds').addEventListener('change', function() {
    document.getElementById('builderOtpGroup').style.display = this.value === 'true' ? 'block' : 'none';
  });
}

function loadCustomTests() {
  const saved = localStorage.getItem('pci-custom-tests');
  if (saved) {
    try {
      customTests = JSON.parse(saved);
    } catch (e) {
      customTests = [];
    }
  }
}

function saveCustomTests() {
  localStorage.setItem('pci-custom-tests', JSON.stringify(customTests));
}

function renderTestCategories() {
  const container = document.getElementById('testCategories');
  container.innerHTML = '';

  const categories = [
    { id: 'non-3ds', name: 'Non-3DS Tests', tests: PREDEFINED_TESTS['non-3ds'] },
    { id: '3ds-frictionless', name: '3DS Frictionless', tests: PREDEFINED_TESTS['3ds-frictionless'] },
    { id: '3ds-challenge', name: '3DS Challenge', tests: PREDEFINED_TESTS['3ds-challenge'] },
    { id: 'custom-validation', name: 'Custom Validation', tests: PREDEFINED_TESTS['custom-validation'] },
    { id: 'custom', name: 'Custom Tests', tests: customTests }
  ];

  categories.forEach(cat => {
    if (cat.tests.length === 0 && cat.id !== 'custom') return;

    const catEl = document.createElement('div');
    catEl.className = 'test-category';
    catEl.innerHTML = `
      <div class="category-header" onclick="toggleCategory('${cat.id}')">
        <span>${cat.name}</span>
        <span>${cat.tests.length} tests</span>
      </div>
      <div class="category-content" id="cat-${cat.id}">
        ${cat.tests.map(test => renderTestItem(test)).join('')}
        ${cat.id === 'custom' && cat.tests.length === 0 ? '<div style="padding: 16px; color: #666; font-size: 12px; text-align: center;">No custom tests yet.<br>Use the Builder tab to create one.</div>' : ''}
      </div>
    `;
    container.appendChild(catEl);
  });
}

function renderTestItem(test) {
  const result = testResults[test.id];
  const statusClass = result ? (result.passed ? 'passed' : 'failed') : '';
  const statusBadge = result ? (result.passed ? 'passed' : 'failed') : 'pending';

  return `
    <div class="test-item ${statusClass} ${currentTest?.id === test.id ? 'selected' : ''}" onclick="selectTest('${test.id}')">
      <div class="test-name">${test.name}</div>
      <div class="test-desc">${test.description}</div>
      <div class="test-status">
        <span class="status-badge ${statusBadge}">${statusBadge.toUpperCase()}</span>
        ${result ? `<span style="color: #666;">${result.duration}ms</span>` : ''}
      </div>
    </div>
  `;
}

function toggleCategory(id) {
  const content = document.getElementById('cat-' + id);
  content.classList.toggle('expanded');
}

// ==================== TEST SELECTION & EXECUTION ====================
function selectTest(testId) {
  // Find test in all categories
  let test = null;
  for (const category of Object.values(PREDEFINED_TESTS)) {
    test = category.find(t => t.id === testId);
    if (test) break;
  }
  if (!test) {
    test = customTests.find(t => t.id === testId);
  }

  if (!test) return;

  currentTest = test;
  document.getElementById('currentTestTitle').textContent = test.name;
  document.getElementById('btnRunTest').disabled = false;

  // Show instructions
  showTestInstructions(test);

  // Update UI
  renderTestCategories();
}

function showTestInstructions(test) {
  const instructionsEl = document.getElementById('testInstructions');
  const cardDetailsEl = document.getElementById('cardDetails');
  const otpInfoEl = document.getElementById('otpInfo');
  const stepsEl = document.getElementById('instructionSteps');

  cardDetailsEl.innerHTML = `
    <div class="card-field">
      <div class="card-field-label">Card Number</div>
      <div class="card-field-value">${test.card.number}</div>
    </div>
    <div class="card-field">
      <div class="card-field-label">Expiry</div>
      <div class="card-field-value">${test.card.expiry}</div>
    </div>
    <div class="card-field">
      <div class="card-field-label">CVV</div>
      <div class="card-field-value">${test.card.cvv}</div>
    </div>
    <div class="card-field">
      <div class="card-field-label">Name</div>
      <div class="card-field-value">${test.card.name}</div>
    </div>
  `;

  if (test.otp) {
    otpInfoEl.style.display = 'block';
    otpInfoEl.innerHTML = `<strong>OTP to enter:</strong> <span style="font-family: monospace; font-size: 16px; color: #4fc3f7;">${test.otp}</span>`;
  } else {

  }

    test.otp ? `Enter OTP: ${test.otp} when prompted` : null,

  ].filter(Boolean);

  stepsEl.innerHTML = `<ol>${steps.map(s => `<li>${s}</li>`).join('')}</ol>`;

async function runCurrentTest() {
  if (!currentTest || isRunning) return;

  isRunning = true;
  capturedEvents = [];
  iframeReady = false;

  document.getElementById('btnRunTest').style.display = 'none';
  document.getElementById('btnStopTest').style.display = 'inline-flex';

  // Clear events
  clearEvents();
  logEvent('info', 'TEST_START', `Starting test: ${currentTest.name}`);

  const startTime = Date.now();

  // Build and load iframe URL
  const url = buildTestUrl(currentTest);
  iframe.src = url;
  logEvent('info', 'IFRAME_LOAD', `Loading: ${url.substring(0, 100)}...`);

  // Start timeout for test
  currentTest.startTime = startTime;
  currentTest.timeoutId = setTimeout(() => {
    if (isRunning) {
      finishTest(false, 'Test timed out after 120 seconds');
    }
  }, 120000);
}

function stopCurrentTest() {
  if (currentTest?.timeoutId) {
    clearTimeout(currentTest.timeoutId);
  }
  finishTest(false, 'Test stopped by user');
}

function finishTest(passed, message) {
  if (!currentTest) return;

  isRunning = false;
  const duration = Date.now() - (currentTest.startTime || Date.now());

  // Validate assertions
  const assertionResults = validateAssertions(currentTest);
  const allPassed = passed && assertionResults.every(a => a.passed);

  testResults[currentTest.id] = {
    passed: allPassed,
    duration,
    message,
    events: [...capturedEvents],
    assertions: assertionResults,
    timestamp: new Date().toISOString()
  };

  logEvent(allPassed ? 'expected' : 'error', 'TEST_END', `Test ${allPassed ? 'PASSED' : 'FAILED'}: ${message || ''}`);

  // Take screenshot on failure
  if (!allPassed && !isRecording) {
    captureScreenshot();
  }

  // Update UI
  document.getElementById('btnRunTest').style.display = 'inline-flex';
  document.getElementById('btnStopTest').style.display = 'none';

  renderTestCategories();
  updateReportTab();

  showToast(allPassed ? 'Test Passed!' : 'Test Failed', allPassed ? 'success' : 'error');
}

function validateAssertions(test) {
  return test.assertions.map(assertion => {
    let passed = false;

    switch (assertion.type) {
      case 'event':
        passed = capturedEvents.some(e =>
          e.type === assertion.event ||
          (e.parsed && e.parsed.messageType === assertion.event)
        );
        break;
      case 'no-event':
        passed = !capturedEvents.some(e =>
          e.type === assertion.event ||
          (e.parsed && e.parsed.messageType === assertion.event)
        );
        break;
      case 'response':
        const successEvent = capturedEvents.find(e => e.parsed?.messageType === 'CardSubmitSuccess');
        if (successEvent && assertion.check === 'exists') {
          passed = !!successEvent.parsed[assertion.field];
        }
        break;
      case 'validation-fail':
        passed = capturedEvents.some(e => e.type === 'false' || e.type === 'invalid');
        break;
      case 'custom-validation-reject':
        // Check if we sent a reject response
        passed = capturedEvents.some(e => e.type === 'VALIDATION_REJECT');
        break;
    }

    return { ...assertion, passed };
  });
}

// ==================== URL BUILDING ====================
function buildTestUrl(test) {
  const baseUrl = 'https://service-pilot.pcibooking.net/api/payments/capturecard';
  const params = new URLSearchParams();

  // Default params
  params.set('brand', 'ArekSandbox');
  params.set('language', 'en');
  params.set('css', 'boutiquesirenuse');
  params.set('cvv', 'true');
  params.set('autoDetectCardType', 'true');
  params.set('submitWithPostMessage', 'true');
  params.set('postMessageHost', window.location.origin);
  params.set('success', 'https://pcib2.free.beeceptor.com/Success.aspx?cardToken={cardToken}');
  params.set('failure', 'https://pcib2.free.beeceptor.com/failure');

  // Test-specific config
  if (test.config) {
    Object.entries(test.config).forEach(([key, value]) => {
      if (value !== undefined && value !== '') {
        params.set(key, value);
      }
    });
  }

  return `${baseUrl}?${params.toString()}`;
}

// ==================== POST MESSAGE HANDLING ====================
function setupPostMessageListener() {
  window.addEventListener('message', handlePostMessage);
}

function handlePostMessage(event) {
  if (!event.origin.includes('pcibooking.net')) return;

  const data = event.data;
  let parsed = null;

  if (typeof data === 'string') {
    try { parsed = JSON.parse(data); } catch (e) {}
  } else if (typeof data === 'object') {
    parsed = data;
  }

  const eventType = parsed?.messageType || data;

  capturedEvents.push({
    type: eventType,
    data: data,
    parsed: parsed,
    timestamp: Date.now()
  });

  // Log event
  const isExpected = currentTest?.expectedEvents?.includes(eventType);
  logEvent(isExpected ? 'expected' : 'info', eventType, typeof data === 'string' ? data : JSON.stringify(parsed));

  // Handle specific events
  if (data === 'ready') {
    iframeReady = true;
    logEvent('expected', 'IFRAME_READY', 'Iframe is ready for input');
  }

  if (parsed?.messageType === 'CustomValidation') {
    handleCustomValidation(parsed);
  }

  if (parsed?.messageType === 'CardSubmitSuccess') {
    finishTest(true, `Token: ${parsed.cardToken?.substring(0, 20)}...`);
  }

  if (parsed?.messageType === 'CardSubmitFailure') {
    const expectedFailure = currentTest?.expectedOutcome === 'failure';
    finishTest(expectedFailure, parsed.message || 'Card submission failed');
  }

  if (parsed?.messageType === 'ThreeDsChallengeLoaded' || parsed?.messageType === 'OTPdisplayed') {
    iframeWrapper.style.minHeight = '600px';
    iframe.style.height = '600px';
  }
}

function handleCustomValidation(data) {
  lastValidationData = data;

  const shouldReject = currentTest?.config?.customValidationAction === 'reject' ||
    (currentTest?.config?.customValidationAction === 'reject-visa' && data.cardType?.toLowerCase() === 'visa') ||
    (currentTest?.config?.customValidationAction === 'reject-mastercard' && data.cardType?.toLowerCase() === 'mastercard');

  const response = {
    action: 'customValidationResponse',
    success: !shouldReject,
    message: shouldReject ? 'Card rejected by custom validation' : undefined
  };

  iframe.contentWindow.postMessage(response, 'https://service-pilot.pcibooking.net');

  if (shouldReject) {
    capturedEvents.push({ type: 'VALIDATION_REJECT', data: response, timestamp: Date.now() });
    logEvent('expected', 'VALIDATION_REJECT', 'Custom validation rejected the card');

    if (currentTest?.expectedOutcome === 'validation-reject') {
      setTimeout(() => finishTest(true, 'Card correctly rejected by custom validation'), 500);
    }
  } else {
    logEvent('expected', 'VALIDATION_ACCEPT', 'Custom validation accepted the card');
  }
}

// ==================== EVENT LOGGING ====================
function logEvent(type, eventName, data) {
  const eventLog = document.getElementById('eventLog');

  // Remove placeholder
  if (eventLog.querySelector('.no-events')) {
    eventLog.innerHTML = '';
  }

  const entry = document.createElement('div');
  entry.className = `event-entry ${type}`;
  entry.innerHTML = `
    <div class="event-time">${new Date().toLocaleTimeString()}.${Date.now() % 1000}</div>
    <div class="event-type">${eventName}</div>
    <div class="event-data">${data}</div>
    ${currentTest ? `<div class="event-validation ${currentTest.expectedEvents?.includes(eventName) ? 'pass' : ''}">${currentTest.expectedEvents?.includes(eventName) ? 'EXPECTED' : ''}</div>` : ''}
  `;

  eventLog.appendChild(entry);
  eventLog.scrollTop = eventLog.scrollHeight;
}

function clearEvents() {
  document.getElementById('eventLog').innerHTML = '<div class="no-events" style="text-align: center; color: #666; padding: 40px;">No events captured yet</div>';
  capturedEvents = [];
}

// ==================== RECORDING ====================
async function toggleRecording() {
  if (isRecording) {
    stopRecording();
  } else {
    await startRecording();
  }
}

async function startRecording() {
  try {
    const stream = await navigator.mediaDevices.getDisplayMedia({
      video: { mediaSource: 'screen' },
      audio: false
    });

    mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
    recordedChunks = [];

    mediaRecorder.ondataavailable = (e) => {
      if (e.data.size > 0) recordedChunks.push(e.data);
    };

    mediaRecorder.onstop = () => {
      const blob = new Blob(recordedChunks, { type: 'video/webm' });
      const url = URL.createObjectURL(blob);

      mediaItems.push({
        type: 'video',
        url: url,
        timestamp: new Date().toISOString(),
        testId: currentTest?.id || 'manual'
      });

      updateMediaTab();
      stream.getTracks().forEach(track => track.stop());
    };

    mediaRecorder.start();
    isRecording = true;
    iframeWrapper.classList.add('recording');
    document.getElementById('btnStartRecording').textContent = 'Stop Recording';
    document.getElementById('btnStartRecording').classList.add('btn-danger');
    document.getElementById('btnStartRecording').classList.remove('btn-secondary');

    showToast('Recording started', 'success');
  } catch (e) {
    showToast('Failed to start recording: ' + e.message, 'error');
  }
}

function stopRecording() {
  if (mediaRecorder && isRecording) {
    mediaRecorder.stop();
    isRecording = false;
    iframeWrapper.classList.remove('recording');
    document.getElementById('btnStartRecording').textContent = 'Start Recording';
    document.getElementById('btnStartRecording').classList.remove('btn-danger');
    document.getElementById('btnStartRecording').classList.add('btn-secondary');

    showToast('Recording saved', 'success');
  }
}

async function captureScreenshot() {
  try {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = iframeWrapper.offsetWidth;
    canvas.height = iframeWrapper.offsetHeight;

    // Note: This won't capture cross-origin iframe content due to security
    // We capture the wrapper area instead
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#333';
    ctx.font = '14px sans-serif';
    ctx.fillText(`Screenshot - Test: ${currentTest?.name || 'Unknown'}`, 20, 30);
    ctx.fillText(`Time: ${new Date().toISOString()}`, 20, 50);
    ctx.fillText('Note: Iframe content not captured (cross-origin)', 20, 70);

    const url = canvas.toDataURL('image/png');

    mediaItems.push({
      type: 'screenshot',
      url: url,
      timestamp: new Date().toISOString(),
      testId: currentTest?.id || 'manual'
    });

    updateMediaTab();
  } catch (e) {
    console.error('Screenshot failed:', e);
  }
}

function updateMediaTab() {
  const container = document.getElementById('mediaContainer');

  if (mediaItems.length === 0) {
    container.innerHTML = '<div class="no-media">No recordings or screenshots yet.<br>Start recording before running a test.</div>';
    return;
  }

  container.innerHTML = mediaItems.map((item, i) => `
    <div class="media-item">
      <div class="media-header">
        <span>${item.type === 'video' ? 'Video' : 'Screenshot'} - ${item.testId}</span>
        <span style="color: #666; font-size: 10px;">${new Date(item.timestamp).toLocaleString()}</span>
      </div>
      <div class="media-content">
        ${item.type === 'video'
          ? `<video controls src="${item.url}"></video>`
          : `<img src="${item.url}" alt="Screenshot">`
        }
      </div>
    </div>
  `).join('');
}

// ==================== REPORT ====================
function updateReportTab() {
  const results = Object.values(testResults);
  const passed = results.filter(r => r.passed).length;
  const failed = results.filter(r => !r.passed).length;

  document.getElementById('passedCount').textContent = passed;
  document.getElementById('failedCount').textContent = failed;
  document.getElementById('totalCount').textContent = results.length;

  const detailsEl = document.getElementById('reportDetails');
  detailsEl.innerHTML = results.map(result => {
    const test = findTestById(result);
    return `
      <div class="report-detail">
        <div class="report-detail-header">
          <span class="report-detail-title">${test?.name || 'Unknown Test'}</span>
          <span class="report-detail-status ${result.passed ? 'passed' : 'failed'}">${result.passed ? 'PASSED' : 'FAILED'}</span>
        </div>
        <div style="font-size: 11px; color: #888; margin-bottom: 8px;">Duration: ${result.duration}ms | ${new Date(result.timestamp).toLocaleString()}</div>
        <div class="report-assertions">
          ${result.assertions?.map(a => `
            <div class="assertion-item">
              <div class="assertion-icon ${a.passed ? 'pass' : 'fail'}">${a.passed ? '✓' : '✗'}</div>
              <span>${a.description}</span>
            </div>
          `).join('') || '<div style="color: #666;">No assertions</div>'}
        </div>
      </div>
    `;
  }).join('') || '<div style="text-align: center; color: #666; padding: 40px;">No test results yet</div>';
}

function findTestById(result) {
  for (const category of Object.values(PREDEFINED_TESTS)) {
    const test = category.find(t => testResults[t.id] === result);
    if (test) return test;
  }
  return customTests.find(t => testResults[t.id] === result);
}

function downloadReport() {
  const report = {
    generated: new Date().toISOString(),
    summary: {
      total: Object.keys(testResults).length,
      passed: Object.values(testResults).filter(r => r.passed).length,
      failed: Object.values(testResults).filter(r => !r.passed).length
    },
    results: Object.entries(testResults).map(([id, result]) => ({
      testId: id,
      ...result
    }))
  };

  const blob = new Blob([JSON.stringify(report, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `pci-test-report-${new Date().toISOString().split('T')[0]}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

      expiry: expiry || '12/28',
      cvv: cvv || '123',
      name: cardName || 'Test User',
      type: 'custom',
      flow: threeDS === 'true' ? '3ds' : 'none'
    },
    otp: otp || null,
    config: {
      ThreeDS: threeDS,
      useCustomValidation: 'true',
      customValidationAction: validation,
      email: 'test@test.com',
      amount: '1000'
    },
    expectedEvents: events.length ? events : ['ready'],
    expectedOutcome: outcome,
    assertions: [
      { type: 'event', event: 'ready', description: 'Iframe loads' }
    ]
  };

  customTests.push(test);
  saveCustomTests();
  renderTestCategories();

  showToast('Custom test saved!', 'success');

  // Clear form
  document.getElementById('builderName').value = '';
  document.getElementById('builderDesc').value = '';
  document.getElementById('builderCard').value = '';
}

// ==================== IMPORT/EXPORT ====================
function exportTests() {
  const data = {
    customTests,
    testResults,
    exported: new Date().toISOString()
  };

  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `pci-tests-${new Date().toISOString().split('T')[0]}.json`;
  a.click();
  URL.revokeObjectURL(url);

  showToast('Tests exported', 'success');
}

function importTests() {
  document.getElementById('importFile').click();
}

function handleImport(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (data.customTests) {
        customTests = [...customTests, ...data.customTests];
        saveCustomTests();
      }
      if (data.testResults) {
        testResults = { ...testResults, ...data.testResults };
      }
      renderTestCategories();
      updateReportTab();
      showToast('Tests imported', 'success');
    } catch (err) {
      showToast('Invalid file format', 'error');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ==================== RUN ALL TESTS ====================
async function runAllTests() {
  const allTests = [
    ...PREDEFINED_TESTS['non-3ds'],
    ...PREDEFINED_TESTS['3ds-frictionless'],
    ...PREDEFINED_TESTS['3ds-challenge'],
    ...PREDEFINED_TESTS['custom-validation'],
    ...customTests
  ];

  document.getElementById('runAllProgress').classList.add('active');

  for (let i = 0; i < allTests.length; i++) {
    const test = allTests[i];
    document.getElementById('progressText').textContent = `Running: ${test.name} (${i + 1}/${allTests.length})`;
    document.getElementById('progressFill').style.width = `${((i + 1) / allTests.length) * 100}%`;

    selectTest(test.id);

    // Note: Full automation would require user interaction for card entry
    // This just selects each test - user needs to run them manually
    await new Promise(resolve => setTimeout(resolve, 500));
  }

  document.getElementById('runAllProgress').classList.remove('active');
  showToast('All tests selected. Run each test manually with card entry.', 'success');
}

// ==================== UI HELPERS ====================
function switchTab(tabId) {
  document.querySelectorAll('.results-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));

  document.querySelector(`.results-tab[onclick="switchTab('${tabId}')"]`).classList.add('active');
  document.getElementById('tab-' + tabId).classList.add('active');
}

function showToast(message, type) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();

  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.textContent = message;
  document.body.appendChild(toast);

  setTimeout(() => toast.remove(), 3000);
}

// Initialize
init();
</script>
